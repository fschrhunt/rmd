version: 2
multi-ecosystem-groups:
  dependencies:
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    versioning-strategy: increase-if-necessary
