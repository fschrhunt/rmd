[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rmd"
version = "0.1.0"
description = "Remove embedded metadata from files without overwriting the original"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "fschrhunt" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
rmd = "rmd.cli:main"

[tool.setuptools.packages.find]
include = ["rmd*"]
